services:
  - type: web
    name: classic-trip
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm ci && npm run verify && npm prune --omit=dev
    preDeployCommand: npm run db:indexes
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Classic Trip
      - key: APP_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: MONGO_TRANSACTIONS
        value: "true"
      - key: MONGO_MIN_POOL_SIZE
        value: "1"
      - key: MONGO_MAX_POOL_SIZE
        value: "24"
      - key: MONGO_MAX_CONNECTING
        value: "4"
      - key: MONGO_MAX_IDLE_TIME_MS
        value: "60000"
      - key: MONGO_WAIT_QUEUE_TIMEOUT_MS
        value: "30000"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "30000"
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: "30000"
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: "90000"
      - key: MONGO_CONNECT_RETRY_ATTEMPTS
        value: "5"
      - key: MONGO_CONNECT_RETRY_DELAY_MS
        value: "750"
      - key: MONGO_IP_FAMILY
        value: "4"
      - key: MONGO_AUTO_INDEX
        value: "false"
      - key: DASHBOARD_DB_READ_CONCURRENCY
        value: "4"
      - key: MONGO_READ_CONCURRENCY
        value: "6"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: classic-trip-cache
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: REDIS_PREFIX
        value: "classic-trip:"
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_MFA_ENABLED
        value: "false"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: classic-trip
      - key: PAYMENT_PROVIDER
        value: pesapal
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PESAPAL_API_URL
        value: https://pay.pesapal.com/v3/api
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        sync: false
      - key: PESAPAL_IPN_URL
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: PESAPAL_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: PUSH_ENABLED
        value: "false"
      - key: ENABLE_JOBS
        value: "false"

  - type: worker
    name: classic-trip-worker
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm ci --omit=dev
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        fromService:
          type: web
          name: classic-trip
          envVarKey: APP_URL
      - key: MONGO_URI
        fromService:
          type: web
          name: classic-trip
          envVarKey: MONGO_URI
      - key: MONGO_DB_NAME
        fromService:
          type: web
          name: classic-trip
          envVarKey: MONGO_DB_NAME
      - key: MONGO_TRANSACTIONS
        value: "true"
      - key: MONGO_MIN_POOL_SIZE
        value: "1"
      - key: MONGO_MAX_POOL_SIZE
        value: "6"
      - key: MONGO_MAX_CONNECTING
        value: "2"
      - key: MONGO_MAX_IDLE_TIME_MS
        value: "60000"
      - key: MONGO_WAIT_QUEUE_TIMEOUT_MS
        value: "30000"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "30000"
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: "30000"
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: "90000"
      - key: MONGO_CONNECT_RETRY_ATTEMPTS
        value: "5"
      - key: MONGO_CONNECT_RETRY_DELAY_MS
        value: "750"
      - key: MONGO_IP_FAMILY
        value: "4"
      - key: MONGO_AUTO_INDEX
        value: "false"
      - key: SESSION_SECRET
        fromService:
          type: web
          name: classic-trip
          envVarKey: SESSION_SECRET
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: classic-trip-cache
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: REDIS_PREFIX
        value: "classic-trip:"
      - key: ENABLE_JOBS
        value: "true"
      - key: JOB_PROCESS_OUTBOX
        value: "*/10 * * * * *"
      - key: JOB_MATERIALIZE_SCHEDULES
        value: "0 3 * * *"
      - key: JOB_PURGE_ARCHIVED_RECORDS
        value: "30 4 * * *"
      - key: EMAIL_FROM
        fromService:
          type: web
          name: classic-trip
          envVarKey: EMAIL_FROM
      - key: SMTP_HOST
        fromService:
          type: web
          name: classic-trip
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: classic-trip
          envVarKey: SMTP_PORT
      - key: SMTP_USER
        fromService:
          type: web
          name: classic-trip
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          type: web
          name: classic-trip
          envVarKey: SMTP_PASS
      - key: SMS_API_URL
        fromService:
          type: web
          name: classic-trip
          envVarKey: SMS_API_URL
      - key: SMS_API_TOKEN
        fromService:
          type: web
          name: classic-trip
          envVarKey: SMS_API_TOKEN
      - key: WHATSAPP_ACCESS_TOKEN
        fromService:
          type: web
          name: classic-trip
          envVarKey: WHATSAPP_ACCESS_TOKEN
      - key: WHATSAPP_PHONE_NUMBER_ID
        fromService:
          type: web
          name: classic-trip
          envVarKey: WHATSAPP_PHONE_NUMBER_ID

  - type: keyvalue
    name: classic-trip-cache
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: volatile-lru
